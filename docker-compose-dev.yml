name: not-crm

services:
  postgres:
    container_name: postgres
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U "${POSTGRES_USER}" -d postgres
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  seq:
    container_name: seq
    image: datalust/seq:2026.1
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "8081:80"
    volumes:
      - seq_data:/data

  directory-service-database:
    image: postgres:17
    environment:
      PGHOST: postgres
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TARGET_DATABASE: ${DIRECTORY_POSTGRES_DB}
      TARGET_USER: ${DIRECTORY_POSTGRES_USER}
      TARGET_PASSWORD: ${DIRECTORY_POSTGRES_PASSWORD:?Set DIRECTORY_POSTGRES_PASSWORD in .env}
    volumes:
      - ./deploy/postgres/ensure-database.sh:/ensure-database.sh:ro
    entrypoint: ["bash", "/ensure-database.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  directory-service-migrations:
    container_name: directory-service-migrations
    image: directory-service-migrator:dev

    build:
      context: ./backend
      dockerfile: DirectoryService/Dockerfile
      target: migrator
      secrets:
        - github_nuget_credentials

    environment:
      ConnectionStrings__DirectoryServiceDbContext: "Host=postgres;Port=5432;Database=${DIRECTORY_POSTGRES_DB};Username=${DIRECTORY_POSTGRES_USER};Password=${DIRECTORY_POSTGRES_PASSWORD:?Set DIRECTORY_POSTGRES_PASSWORD in .env}"
      Seq__ServerUrl: http://seq
      Serilog__WriteTo__1__Args__serverUrl: http://seq

    depends_on:
      directory-service-database:
        condition: service_completed_successfully

    restart: no

  directory-service:
    image: directory-service:dev
    container_name: directory-service

    build:
      context: ./backend
      dockerfile: DirectoryService/Dockerfile
      target: final
      secrets:
        - github_nuget_credentials

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development

      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__DirectoryServiceDbContext: "Host=postgres;Port=5432;Database=${DIRECTORY_POSTGRES_DB};Username=${DIRECTORY_POSTGRES_USER};Password=${DIRECTORY_POSTGRES_PASSWORD:?Set DIRECTORY_POSTGRES_PASSWORD in .env}"
      Seq__ServerUrl: http://seq
      Serilog__WriteTo__1__Args__serverUrl: http://seq

    ports:
      - "8010:8080"

    depends_on:
      postgres:
        condition: service_healthy

      directory-service-migrations:
        condition: service_completed_successfully

      seq:
        condition: service_started

      redis:
        condition: service_healthy

    restart: unless-stopped

  employee-service-database:
    image: postgres:17
    environment:
      PGHOST: postgres
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TARGET_DATABASE: ${EMPLOYEE_POSTGRES_DB}
      TARGET_USER: ${EMPLOYEE_POSTGRES_USER}
      TARGET_PASSWORD: ${EMPLOYEE_POSTGRES_PASSWORD:?Set EMPLOYEE_POSTGRES_PASSWORD in .env}
    volumes:
      - ./deploy/postgres/ensure-database.sh:/ensure-database.sh:ro
    entrypoint: ["bash", "/ensure-database.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  employee-service:
    image: employee-service:dev
    container_name: employee-service

    build:
      context: ./backend
      dockerfile: EmployeeService/Dockerfile
      target: final
      secrets:
        - github_nuget_credentials

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__EmployeeServiceDbContext: "Host=postgres;Port=5432;Database=${EMPLOYEE_POSTGRES_DB};Username=${EMPLOYEE_POSTGRES_USER};Password=${EMPLOYEE_POSTGRES_PASSWORD:?Set EMPLOYEE_POSTGRES_PASSWORD in .env}"
      Serilog__WriteTo__1__Args__serverUrl: http://seq

    ports:
      - "8020:8080"

    depends_on:
      employee-service-database:
        condition: service_completed_successfully
      seq:
        condition: service_started

    restart: unless-stopped

  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - directory-service
      - frontend
    restart: always

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: ./Dockerfile

    ports:
      - "3000:3000"

    restart: always
    

  redis:
    container_name: redis
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

secrets:
  github_nuget_credentials:
    environment: GITHUB_NUGET_CREDENTIALS

volumes:
  postgres_data:
  seq_data:
  redis_data:
